<!-- Formulario Actualizado con los nuevos campos especificados -->
<form id="reservationForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
    
    <!-- Fila 1: Mes & Renta No. -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-bold text-quinta-oliveDark uppercase tracking-wider mb-1.5">Mes *</label>
            <select id="mes" required class="w-full px-3 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-quinta-olive focus:bg-white font-medium">
                <option value="">Selecciona mes...</option>
                <option value="01. enero">01. enero</option>
                <option value="02. febrero">02. febrero</option>
                <option value="03. marzo">03. marzo</option>
                <option value="04. abril">04. abril</option>
                <option value="05. mayo">05. mayo</option>
                <option value="06. junio">06. junio</option>
                <option value="07. julio">07. julio</option>
                <option value="08. agosto">08. agosto</option>
                <option value="09. septiembre">09. septiembre</option>
                <option value="10. octubre">10. octubre</option>
                <option value="11. noviembre">11. noviembre</option>
                <option value="12. diciembre">12. diciembre</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-quinta-oliveDark uppercase tracking-wider mb-1.5">Renta No. (Consecutivo)</label>
            <input type="text" id="rentaNo" readonly class="w-full px-3 py-2.5 text-sm bg-stone-200/60 border border-stone-300 rounded-xl font-bold text-quinta-oliveDark cursor-not-allowed">
        </div>
    </div>

    <!-- Fila 2: Nombre del Cliente -->
    <div>
        <label class="block text-xs font-bold text-quinta-oliveDark uppercase tracking-wider mb-1.5">Nombre Completo *</label>
        <input type="text" id="nombre" required placeholder="Ej. Roberto Morales" class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-quinta-olive focus:bg-white font-medium">
    </div>

    <!-- Fila 3: Personas Estancia & Evento -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-bold text-quinta-oliveDark uppercase tracking-wider mb-1.5">Estancia (Personas)</label>
            <select id="estancia" class="w-full px-3 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-quinta-olive font-medium">
                <option value="0">0 personas</option>
                <option value="2">2 personas</option>
                <option value="4">4 personas</option>
                <option value="6">6 personas</option>
                <option value="8">8 personas</option>
                <option value="10+">10+ personas</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-quinta-oliveDark uppercase tracking-wider mb-1.5">Evento (Personas)</label>
            <select id="evento" class="w-full px-3 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-quinta-olive font-medium">
                <option value="0">Sin evento</option>
                <option value="25">Hasta 25 personas</option>
                <option value="50">Hasta 50 personas</option>
                <option value="75">Hasta 75 personas</option>
                <option value="100">Hasta 100 personas</option>
                <option value="150+">Más de 100 personas</option>
            </select>
        </div>
    </div>

    <!-- Fila 4: Total Venta (Entrada manual) -->
    <div class="p-4 bg-quinta-cream border border-quinta-sand rounded-2xl">
        <label class="block text-xs font-bold text-quinta-oliveDark uppercase tracking-wider mb-1.5">Total Venta ($ MXN) *</label>
        <input type="number" id="totalVenta" step="0.01" min="0" placeholder="0.00" required class="w-full px-3 py-2.5 text-base bg-white border border-stone-300 rounded-xl font-bold text-emerald-800 focus:ring-2 focus:ring-quinta-olive">
    </div>

    <button type="submit" class="w-full py-3.5 bg-quinta-olive hover:bg-quinta-oliveDark text-white font-bold rounded-xl shadow transition">
        Guardar Reserva
    </button>
</form>

<script>
    // Generador automático del número consecutivo (ej: 2026-21)
    function generarRentaNo() {
        const year = new Date().getFullYear();
        const count = reservations.length + 20; // Toma el historial + base previa
        document.getElementById('rentaNo').value = `${year}-${count}`;
    }

    // Ejecutar al cargar la pantalla
    window.addEventListener('DOMContentLoaded', generarRentaNo);
</script>
