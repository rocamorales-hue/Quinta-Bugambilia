<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quinta Bugambilia – Rentas 2026</title>
  <meta name="description" content="Quinta Bugambilia · Real del 14, Hermosillo — panel interno de disponibilidad, cotizaciones y contratos." />
  <meta name="theme-color" content="#1e3a2f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=3').then((reg) => { reg.update(); });
      });
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="site-header"></div>
<script>
  window.QB_PAGE = 'rentas';
  window.QB_SYNC = 'loadData()';
</script>
<script src="nav.js"></script>
<main id="main-content">
  <h1>Rentas 2026</h1>
  <p class="subtitle">Detalle de reservaciones en tiempo real</p>

  <div id="error-box"></div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Sincronizando datos de reservación...</p>
  </div>

  <div id="ui" style="display:none">
    <div class="filters-bar">
      <div class="filter-group">
        <span class="filter-label">Mes:</span>
        <div id="month-filters"></div>
      </div>
      <input type="text" id="search" class="search-input" placeholder="Buscar registros..." oninput="applyFilters()"/>
      <div class="view-toggle">
        <button class="view-btn active" id="btn-cards" onclick="setView('cards')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-btn" id="btn-table" onclick="setView('table')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="summary-bar" id="summary-bar"></div>

    <div id="cards-grid" class="cards-grid"></div>

    <div id="table-wrap" class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    
    <div id="empty-state" class="empty-state" style="display:none">
      <p>No se encontraron registros con los filtros seleccionados.</p>
    </div>
  </div>
</main>

<footer>Quinta Bugambilia 2026 · Datos sincronizados con pestaña Rentas 2026</footer>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSo8m2mzpqf5Z_Znr_F6ZRDOqbZJ7zXuRzIkKkZHjU5A8ZvD3ejb7t6Pq_6YR28j12cAQCqQCqVFSve/pub?gid=652812646&single=true&output=csv';

  const COL_START = 3;
  const COL_END   = 13;

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const MESES_LOW = MESES.map(m => m.toLowerCase());

  let allRows = [];       
  let headers = [];       
  let activeMonth = 'all';
  let currentView = 'cards';

  function parseCSVLine(line) {
    const cols=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
      else{cur+=ch;}
    }
    cols.push(cur.trim());
    return cols;
  }

  function parseMoney(str) {
    if (!str) return 0;
    let s = str.replace(/\$/g,'').replace(/\s/g,'').trim();
    if (!s) return 0;
    const hasComma = s.includes(','), hasDot = s.includes('.');
    if (hasComma && hasDot) {
      if (s.lastIndexOf('.') > s.lastIndexOf(',')) s = s.replace(/,/g,'');
      else s = s.replace(/\./g,'').replace(',','.');
    } else if (hasComma) {
      const parts = s.split(',');
      s = (parts.length===2 && parts[1].length<=2) ? s.replace(',','.') : s.replace(/,/g,'');
    }
    return parseFloat(s) || 0;
  }

  function isMoney(str) {
    return str && (str.trim().startsWith('$') || /^\$?[\d,\.]+$/.test(str.trim()));
  }

  function formatMXN(val) {
    return '$' + val.toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:0});
  }

  function detectMonth(row) {
    for (const cell of row) {
      const c = (cell||'').trim().toLowerCase().replace(/^\d+\.\s*/,'');
      const hit = MESES_LOW.find(m => c === m || c.startsWith(m + ' ') || c.startsWith(m + ','));
      if (hit) return MESES[MESES_LOW.indexOf(hit)];
      const dm = cell.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (dm) return MESES[parseInt(dm[2]) - 1];
      const ym = cell.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (ym) return MESES[parseInt(ym[2]) - 1];
    }
    return null;
  }

  function parseData(text) {
    const lines = text.split('\n').filter(l => l.trim());
    if (!lines.length) return;

    let headerRowIdx = 0;
    let bestScore = -1;
    for (let i = 0; i < Math.min(10, lines.length); i++) {
      const row = parseCSVLine(lines[i]);
      let score = 0;
      for (let ci = COL_START; ci <= COL_END && ci < row.length; ci++) {
        const v = (row[ci]||'').trim();
        if (v && !isMoney(v) && isNaN(parseFloat(v))) score++;
      }
      if (score > bestScore) { bestScore = score; headerRowIdx = i; }
    }

    const headerRow = parseCSVLine(lines[headerRowIdx]);
    headers = [];
    for (let ci = COL_START; ci <= COL_END && ci < headerRow.length; ci++) {
      headers.push((headerRow[ci]||'').trim() || `Col ${ci+1}`);
    }

    allRows = [];
    let currentMonth = null;

    for (let i = headerRowIdx + 1; i < lines.length; i++) {
      const row = parseCSVLine(lines[i]);
      const rowMonth = detectMonth(row);
      if (rowMonth) currentMonth = rowMonth;

      const fields = [];
      let hasData = false;
      for (let ci = COL_START; ci <= COL_END && ci < row.length; ci++) {
        const v = (row[ci]||'').trim();
        fields.push(v);
        if (v) hasData = true;
      }
      if (!hasData) continue;

      const allNumeric = fields.every(f => !f || isMoney(f) || !isNaN(parseFloat(f)));
      if (allNumeric && fields.filter(Boolean).length <= 2) continue;

      allRows.push({ fields, month: currentMonth, raw: row });
    }
  }

  function renderFilters() {
    const months = [...new Set(allRows.map(r => r.month).filter(Boolean))];
    const container = document.getElementById('month-filters');
    container.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn' + (activeMonth==='all'?' active':'');
    allBtn.textContent = 'Todos';
    allBtn.onclick = () => { activeMonth='all'; applyFilters(); };
    container.appendChild(allBtn);

    months.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (activeMonth===m?' active':'');
      btn.textContent = m;
      btn.onclick = () => { activeMonth=m; applyFilters(); };
      container.appendChild(btn);
    });
  }

  function applyFilters() {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.textContent === (activeMonth==='all'?'Todos':activeMonth));
    });

    const q = (document.getElementById('search').value||'').toLowerCase();
    const filtered = allRows.filter(r => {
      if (activeMonth !== 'all' && r.month !== activeMonth) return false;
      if (q && !r.fields.some(f => f.toLowerCase().includes(q))) return false;
      return true;
    });

    renderSummary(filtered);
    
    if(filtered.length === 0) {
      document.getElementById('cards-grid').innerHTML = '';
      document.getElementById('table-body').innerHTML = '';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }
    document.getElementById('empty-state').style.display = 'none';

    renderCards(filtered);
    renderTable(filtered);
  }

  function renderSummary(rows) {
    const total = rows.length;
    let totalMoney = 0;
    rows.forEach(r => {
      r.fields.forEach(f => {
        const v = parseMoney(f);
        if (v > 1000) totalMoney += v;
      });
    });

    const months = new Set(rows.map(r=>r.month).filter(Boolean));
    let html = `<div class="sum-chip">Eventos <strong>${total}</strong></div>`;
    if (months.size > 0) html += `<div class="sum-chip">Meses <strong>${months.size}</strong></div>`;
    if (totalMoney > 0) html += `<div class="sum-chip">Total <strong>${formatMXN(totalMoney)}</strong></div>`;
    document.getElementById('summary-bar').innerHTML = html;
  }

  function renderCards(rows) {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = rows.map((r, idx) => {
      const nameIdx = r.fields.findIndex(f => f && !isMoney(f) && isNaN(parseFloat(f)));
      const name = nameIdx >= 0 ? r.fields[nameIdx] : (r.fields[0] || `Registro ${idx+1}`);
      const badgeHtml = r.month ? `<span class="card-badge badge-green">${r.month}</span>` : '';

      // --- 🟢 CONSTRUCCIÓN DEL MENSAJE DE WHATSAPP 🟢 ---
      let waText = `¡Hola! Aquí tienes los detalles de tu reservación en *Quinta Bugambilia* 🌺\n\n`;
      waText += `👤 *A nombre de:* ${name}\n`;
      
      const fieldRows = headers.map((h, i) => {
        const val = r.fields[i] || '';
        
        // Agregar a WhatsApp si hay dato (excluyendo el nombre que ya lo pusimos arriba)
        if (val && i !== nameIdx) {
          const moneyVal = parseMoney(val);
          const displayForWa = (moneyVal > 0 && isMoney(val)) ? formatMXN(moneyVal) : val;
          waText += `*${h}:* ${displayForWa}\n`;
        }

        if (i === nameIdx) return '';
        if (!val) return `<div class="field-row"><span class="field-key">${h}</span><span class="field-val empty">—</span></div>`;
        const moneyVal = parseMoney(val);
        const valClass = (moneyVal > 0 && isMoney(val)) ? 'money' : '';
        const display = (moneyVal > 0 && isMoney(val)) ? formatMXN(moneyVal) : val;
        return `<div class="field-row">
          <span class="field-key">${h}</span>
          <span class="field-val ${valClass}">${display}</span>
        </div>`;
      }).join('');

      // Agregando las notas extra al mensaje de WhatsApp
      waText += `\n*Información Importante:*\n`;
      waText += `💳 El pago tiene que ser liquidado vía transferencia electrónica o depósito antes de ingresar al inmueble.\n`;
      waText += `📍 *Ubicación:* Fraccionamiento Real del 14, Hermosillo, Sonora.\n`;
      waText += `🗺️ *Mapa:* https://maps.google.com/?q=28.958324,-111.029503\n`;
      waText += `🔐 *Acceso a Real del 14:* Manzana 13 Lote 36 (Usa este dato en caseta).\n`;
      waText += `📜 Te invitamos cordialmente a seguir el reglamento de la Quinta para disfrutar al máximo tu estancia.\n`;
      waText += `💧 *Nota adicional:* Les pedimos de la manera más atenta hacer un uso consciente y cuidadoso del agua, ya que actualmente el fraccionamiento mantiene ciertas restricciones de suministro. ¡Agradecemos mucho su comprensión y apoyo!\n`;

      const waLink = `https://wa.me/?text=${encodeURIComponent(waText)}`;
      // ----------------------------------------------------

      return `<div class="renta-card" style="animation:fadeUp .3s ease ${idx*0.02}s both">
        <div class="card-head">
          <div>
            <a href="${waLink}" target="_blank" class="card-name-link" title="Enviar detalles por WhatsApp">
              <div class="card-name">
                ${name}
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
              </div>
            </a>
            <div class="card-index"># ${idx+1}</div>
          </div>
          ${badgeHtml}
        </div>
        <div class="card-divider"></div>
        <div class="card-fields">${fieldRows}</div>
      </div>`;
    }).join('');
  }

  function renderTable(rows) {
    const thead = document.getElementById('table-head');
    const tbody = document.getElementById('table-body');
    thead.innerHTML = `<tr><th>#</th><th>Mes</th>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>`;

    tbody.innerHTML = rows.map((r, idx) => {
      const cells = r.fields.map((f,i) => {
        if (!f) return `<td class="empty-cell">—</td>`;
        const moneyVal = parseMoney(f);
        if (moneyVal > 0 && isMoney(f)) return `<td class="money-cell">${formatMXN(moneyVal)}</td>`;
        return `<td>${f}</td>`;
      }).join('');
      return `<tr><td>${idx+1}</td><td>${r.month||'—'}</td>${cells}</tr>`;
    }).join('');
  }

  function setView(view) {
    currentView = view;
    document.getElementById('cards-grid').classList.toggle('hidden', view==='table');
    document.getElementById('table-wrap').classList.toggle('visible', view==='table');
    document.getElementById('btn-cards').classList.toggle('active', view==='cards');
    document.getElementById('btn-table').classList.toggle('active', view==='table');
  }

  async function loadData() {
    const btn = document.getElementById('sync-btn');
    btn.classList.add('loading');
    document.getElementById('error-box').style.display='none';
    document.getElementById('loading').style.display='block';
    document.getElementById('ui').style.display='none';

    try {
      const res = await fetch(CSV_URL + '&t=' + Date.now());
      if (!res.ok) {
        if(res.status === 404) {
          throw new Error('Código 404: La pestaña "Rentas 2026" cambió de enlace o fue desvinculada. Por favor ve a tu Google Sheets (Archivo > Compartir > Publicar en la Web) y copia el nuevo enlace CSV.');
        } else {
          throw new Error('HTTP Status ' + res.status);
        }
      }
      const text = await res.text();
      parseData(text);

      if (!allRows.length) throw new Error('Estructura vacía. No se pudieron procesar datos.');

      renderFilters();
      applyFilters();
      document.getElementById('ui').style.display='block';
      document.getElementById('loading').style.display='none';
    } catch(e) {
      document.getElementById('error-box').style.display='block';
      document.getElementById('error-box').innerHTML = '⚠️ <strong>Fallo en Sincronización:</strong><br>' + e.message;
      document.getElementById('loading').style.display='none';
    }
    btn.classList.remove('loading');
  }

  const style = document.createElement('style');
  style.textContent = `@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}`;
  document.head.appendChild(style);

  window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
